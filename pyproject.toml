[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-starfield"
version = "4.0.0"
description = "A zero-dependency deep-space combat roguelite for your terminal"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "fortunexbt"}]
keywords = ["terminal", "tui", "game", "starfield", "ansi"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment :: Arcade",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/fortunexbt/terminal-starfield"
Demo = "https://terminal-starfield.vercel.app"
Issues = "https://github.com/fortunexbt/terminal-starfield/issues"
Changelog = "https://github.com/fortunexbt/terminal-starfield/blob/main/CHANGELOG.md"

[project.scripts]
starfield = "terminal_starfield.cli:main"

[tool.setuptools]
packages = ["terminal_starfield"]
