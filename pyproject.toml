[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-starfield"
version = "4.0.0"
description = "A zero-dependency deep-space combat roguelite for your terminal"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "fortunexbt"}]
keywords = ["terminal", "tui", "game", "starfield", "ansi"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment :: Arcade",
]
dependencies = []

[project.scripts]
starfield = "terminal_starfield.cli:main"

[tool.setuptools]
packages = ["terminal_starfield"]
